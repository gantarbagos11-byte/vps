<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MIGSOCK — Login</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#020617;color:#e8f4ff}body{display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 0%,#172554 0,#08152c 38%,#020617 100%)}
.card{width:min(430px,100%);padding:28px;border:1px solid rgba(46,176,255,.35);border-radius:28px;background:rgba(4,16,35,.88);box-shadow:0 25px 80px rgba(0,0,0,.45),0 0 40px rgba(0,130,255,.08);backdrop-filter:blur(18px)}
.brand{text-align:center;margin-bottom:26px}.brand img{width:105px;height:80px;object-fit:contain}.brand h1{margin:2px 0 4px;font-size:30px;letter-spacing:3px}.brand h1 span{color:#20bfff}.brand small{color:#75a9d3;letter-spacing:2px}
label{display:block;margin:0 0 8px;color:#8eb9dd;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px}input{width:100%;height:52px;border:1px solid #24466b;border-radius:15px;background:#020c1e;color:#fff;padding:0 15px;font-size:15px;outline:none;margin-bottom:15px}input:focus{border-color:#20bfff;box-shadow:0 0 0 3px rgba(32,191,255,.12)}button{width:100%;height:54px;border:0;border-radius:16px;color:white;font-weight:900;font-size:14px;letter-spacing:.5px;background:linear-gradient(110deg,#09bdfb,#4d42ff);box-shadow:0 14px 30px rgba(38,113,255,.22);cursor:pointer}button:disabled{opacity:.6}.error{display:none;margin:0 0 14px;padding:11px 13px;border-radius:12px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#ff9ba8;font-size:12px}.hint{text-align:center;color:#6d92b7;font-size:10px;margin-top:18px}.admin-link{display:block;text-align:center;margin-top:14px;color:#54ccff;text-decoration:none;font-size:11px}
</style>
</head><body>
<div class="card">
  <div class="brand"><img src="/static/logo.webp" alt="MIGSOCK"><h1>MIG<span>SOCK</span></h1><small>DUEL V2 • SECURE ACCESS</small></div>
  <div id="error" class="error"></div>
  <form id="loginForm">
    <label>Username</label><input id="username" autocomplete="username" autocapitalize="none" required>
    <label>Password</label><input id="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">LOGIN</button>
  </form>
  <div class="hint">Akses hanya untuk akun yang telah didaftarkan.</div>
  <a class="admin-link" href="/admin">Admin Panel</a>
</div>
<script>
const form=document.getElementById('loginForm'),err=document.getElementById('error'),btn=document.getElementById('submit');
form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='MEMERIKSA...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Login gagal');location.href=d.user?.role==='admin'?'/admin':'/app'}catch(e){err.textContent=e.message;err.style.display='block';btn.disabled=false;btn.textContent='LOGIN'}});
</script>
</body></html>
