<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MIGSOCK — Admin</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#020617;color:#e8f4ff}body{background:radial-gradient(circle at 10% 0%,#172554 0,#08152c 38%,#020617 100%);padding:12px}.wrap{width:min(900px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 18px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:62px;height:55px;object-fit:contain}.brand h1{margin:0;font-size:24px;letter-spacing:2px}.brand small{color:#63caff;font-size:9px;letter-spacing:1.5px}.badge{padding:9px 13px;border:1px solid rgba(0,255,160,.35);border-radius:999px;color:#4ff0ac;background:rgba(0,255,160,.06);font-weight:800;font-size:11px}.card{border:1px solid rgba(46,176,255,.28);border-radius:20px;background:rgba(5,20,42,.84);box-shadow:0 18px 55px rgba(0,0,0,.28);padding:16px;margin-bottom:12px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title strong{font-size:16px}.title small{display:block;color:#6e9bc2;margin-top:4px;font-size:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#8eb9dd;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin:0 0 6px}.field input{width:100%;height:46px;border:1px solid #24466b;border-radius:13px;background:#020c1e;color:#fff;padding:0 12px;outline:none}.field input:focus{border-color:#20bfff}.actions{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:13px;min-height:44px;padding:0 15px;color:#fff;font-weight:900;cursor:pointer;background:#163453}.primary{background:linear-gradient(110deg,#09bdfb,#4d42ff)}.danger{background:linear-gradient(110deg,#ef4665,#a91b49)}button:disabled{opacity:.55}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th{text-align:left;color:#75a8d0;font-size:10px;padding:11px 9px;background:rgba(14,42,72,.5)}td{padding:10px 9px;border-bottom:1px solid rgba(54,98,143,.22);font-size:12px}.status{font-size:10px;font-weight:900}.on{color:#42efac}.off{color:#ff8294}.row-actions{display:flex;gap:5px}.row-actions button{min-height:32px;padding:0 9px;border:0;border-radius:9px;color:#fff;font-size:10px;font-weight:800}.msg{display:none;margin-top:10px;padding:9px 11px;border-radius:10px;font-size:11px}.ok{background:rgba(34,197,94,.1);color:#6ff0ad;border:1px solid rgba(34,197,94,.25)}.err{background:rgba(239,68,68,.1);color:#ff9aa8;border:1px solid rgba(239,68,68,.25)}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.actions{flex-wrap:wrap}.actions .btn{flex:1}.card{padding:13px;border-radius:17px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand"><img src="/static/logo.webp"><div><h1>MIGSOCK ADMIN</h1><small>ACCESS CONTROL • USER MANAGEMENT</small></div></div><div class="badge">ADMIN</div></header>
<section class="card"><div class="title"><div><strong>Tambah User</strong><small>Buat akun yang diizinkan menggunakan aplikasi.</small></div></div>
<form id="addForm"><div class="grid"><div class="field"><label>Username</label><input id="newUser" autocomplete="off" required></div><div class="field"><label>Password</label><input id="newPass" type="password" autocomplete="new-password" required></div></div><div class="actions"><button class="btn primary" type="submit">TAMBAH USER</button><button class="btn" type="button" id="refresh">REFRESH</button><button class="btn danger" type="button" id="logout">LOGOUT</button></div></form><div id="msg" class="msg"></div></section>
<section class="card"><div class="title"><div><strong>Keamanan Admin</strong><small>Ganti password admin tanpa menyentuh source code.</small></div></div><form id="passForm"><div class="grid"><div class="field"><label>Password Baru</label><input id="adminPass" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>Konfirmasi</label><input id="adminPass2" type="password" minlength="8" autocomplete="new-password" required></div></div><div class="actions"><button class="btn primary" type="submit">GANTI PASSWORD</button></div></form></section>
<section class="card"><div class="title"><div><strong>Daftar Akses</strong><small>Hanya akun ACTIVE yang dapat login ke aplikasi.</small></div><strong id="count">0</strong></div><div class="table-wrap"><table><thead><tr><th>USERNAME</th><th>ROLE</th><th>STATUS</th><th>AKSI</th></tr></thead><tbody id="users"></tbody></table></div></section>
</div>
<script>
const usersEl=document.getElementById('users'),countEl=document.getElementById('count'),msg=document.getElementById('msg');
function show(text,ok=false){msg.textContent=text;msg.className='msg '+(ok?'ok':'err');msg.style.display='block';setTimeout(()=>msg.style.display='none',3000)}
async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/login';throw new Error('Session habis')}if(!r.ok||d.ok===false)throw new Error(d.error||`HTTP ${r.status}`);return d}
async function load(){try{const d=await api('/api/admin/users');countEl.textContent=d.users.length;usersEl.innerHTML=d.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td class="status ${u.enabled?'on':'off'}">${u.enabled?'ACTIVE':'DISABLED'}</td><td><div class="row-actions">${u.role==='admin'?'<span style="color:#75a8d0;font-size:10px">PROTECTED</span>':`<button data-user="${esc(u.username)}" data-act="toggle">${u.enabled?'DISABLE':'ENABLE'}</button><button class="danger" data-user="${esc(u.username)}" data-act="delete">DELETE</button>`}</div></td></tr>`).join('');}catch(e){show(e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
usersEl.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const u=b.dataset.user;try{if(b.dataset.act==='delete'){if(!confirm(`Hapus user ${u}?`))return;await api('/api/admin/users/'+encodeURIComponent(u),{method:'DELETE'});show('User dihapus',true)}else{const enable=b.textContent==='ENABLE';await api('/api/admin/users/'+encodeURIComponent(u)+'/enabled',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:enable})});show(enable?'User diaktifkan':'User dinonaktifkan',true)}load()}catch(e){show(e.message)}});
document.getElementById('addForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:newUser.value,password:newPass.value})});newUser.value='';newPass.value='';show('User berhasil ditambahkan',true);load()}catch(e){show(e.message)}});
document.getElementById('passForm').addEventListener('submit',async e=>{e.preventDefault();if(adminPass.value!==adminPass2.value)return show('Konfirmasi password tidak sama');try{await api('/api/admin/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:adminPass.value})});adminPass.value='';adminPass2.value='';show('Password admin berhasil diubah. Silakan login kembali.',true);setTimeout(()=>location.href='/login',900)}catch(e){show(e.message)}});document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login'};load();
</script></body></html>
